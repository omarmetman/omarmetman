<defs><linearGradient id="lgf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141b36"/><stop offset="1" stop-color="#0e1326"/></linearGradient><linearGradient id="lgb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.95"/><stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.07"/></linearGradient><radialGradient id="lgg" cx=".08" cy="0" r=".85"><stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><linearGradient id="lb0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d7f0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="lb1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#77bbdf"/><stop offset="1" stop-color="#68b3db"/></linearGradient><linearGradient id="lb2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b69dce"/><stop offset="1" stop-color="#ae92c9"/></linearGradient><linearGradient id="lb3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f580bd"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
<style>
text{font-family:'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
.m{font-family:'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
@keyframes sweep{0%{transform:translateX(-40%)}100%{transform:translateX(140%)}}
@keyframes pulseGlow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.sw{animation:sweep 6s linear infinite}
.glow{animation:pulseGlow 3.4s ease-in-out infinite}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
