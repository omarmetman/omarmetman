IN</text><text x="312" y="70" font-size="19" font-weight="600" fill="#fff">Mansoura, Egypt</text><text class="m" x="312" y="92" font-size="11" letter-spacing="2.4" fill="#b99dfa" font-weight="700">CLASS</text><text x="312" y="116" font-size="19" font-weight="600" fill="#fff">Full Stack Software Developer</text><text class="m" x="312" y="138" font-size="11" letter-spacing="2.4" fill="#b99dfa" font-weight="700">LEVEL</text><text x="312" y="162" font-size="19" font-weight="600" fill="#fff">5+ years in production</text><text class="m" x="312" y="184" font-size="11" letter-spacing="2.4" fill="#b99dfa" font-weight="700">EDUCATION</text><text x="312" y="208" font-size="19" font-weight="600" fill="#fff">Mechatronics Engineering @ Delta University</text><text class="m" x="312" y="230" font-size="11" letter-spacing="2.4" fill="#b99dfa" font-weight="700">SPECIAL ATTACK</text><text x="312" y="256" font-size="19" font-weight="700" fill="#fff">Telegram Bots</text><rect x="490" y="242" width="310" height="14" rx="7" fill="#1e2547"/><rect class="grow" x="490" y="242" width="294.5" height="14" rx="7" fill="url(#bar)"/><rect x="494" y="244" width="286.5" height="4" rx="2" fill="#fff" opacity=".25"/><text class="m" x="812" y="255" font-size="14" font-weight="800" fill="#22d3ee">95%</text><text class="m" x="312" y="286" font-size="11" letter-spacing="2.4" fill="#b99dfa" font-weight="700">SIDE QUESTS</text><rect x="312.0" y="296" width="96.4" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".55"/><text class="m" x="360.2" y="312.1" font-size="11.5" text-anchor="middle" fill="#90e9f6" letter-spacing=".3">AI chatbots</text><rect x="418.4" y="296" width="196.2" height="24" rx="12.0" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".55"/><text class="m" x="516.6" y="312.1" font-size="11.5" text-anchor="middle" fill="#c5aefa" letter-spacing=".3">Offline-first mobile apps</text><rect x="624.7" y="296" width="96.4" height="24" rx="12.0"