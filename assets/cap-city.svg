<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-labelledby="t d">
<title id="t">THE LIVING CITY: One full year of work rendered as an isometric hologram and rebuilt daily by a GitHub Actions satellite. Each floor tile is a day, each tower is code shipped that day. The pentagon radar scores Commit, Issue, Pull Request, Review and Repo - pure proof of work, with no language labels by design.</title>
<desc id="d">THE LIVING CITY. One full year of work rendered as an isometric hologram and rebuilt daily by a GitHub Actions satellite. Each floor tile is a day, each tower is code shipped that day. The pentagon radar scores Commit, Issue, Pull Request, Review and Repo - pure proof of work, with no language labels by design.</desc>
<defs><filter id="b4" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter><filter id="b10" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter><filter id="b18" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter><linearGradient id="cp3f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2142"/><stop offset="1" stop-color="#0f1530"/></linearGradient><linearGradient id="cp3b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.95"/><stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.08"/></linearGradient><radialGradient id="cp3g" cx=".1" cy=".05" r=".8"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><linearGradient id="cp3glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
.m{font-family:'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
@keyframes sweep{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
.fl{animation:fl 5.5s ease-in-out infinite}
.fl2{animation:fl 7s ease-in-out -2s infinite}
.fl3{animation:fl 4.6s ease-in-out -1s infinite}
.tw{animation:tw 3.4s ease-in-out infinite}
.pr{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
.sw{animation:sweep 5s linear infinite}
.sw2{animation:sweep 4s linear infinite}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 2.2s .4s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="14" y="24" width="852" height="206" rx="18" fill="#000" opacity=".5" filter="url(#b10)"/><rect x="4" y="16" width="872" height="210" rx="18" fill="#09373e"/><rect x="4" y="10.0" width="872" height="210" rx="18" fill="#0e5964"/><rect x="4" y="4" width="872" height="210" rx="18" fill="url(#cp3f)"/><rect x="4" y="4" width="872" height="210" rx="18" fill="url(#cp3g)"/><rect x="4.75" y="4.75" width="870.5" height="208.5" rx="17.5" fill="none" stroke="url(#cp3b)" stroke-width="1.5"/><line x1="22" y1="5.5" x2="858" y2="5.5" stroke="#fff" stroke-opacity=".14"/><rect x="14" y="14" width="852" height="182" rx="12" fill="url(#cp3glow)"/><ellipse cx="54" cy="58" rx="17" ry="4.8" fill="#000" opacity="0.45" filter="url(#b4)"/><g class="fl"><polygon points="34.9,25.0 54.0,36.0 54.0,58.0 34.9,47.0" fill="#1ba5ba"/><polygon points="54.0,36.0 73.1,25.0 73.1,47.0 54.0,58.0" fill="#116a77"/><polygon points="54.0,14.0 73.1,25.0 54.0,36.0 34.9,25.0" fill="#60dff3"/><g transform="matrix(0.1905 0.1100 -0.1905 0.1100 54.00 14.00)"><polygon points="50,8 90,30 50,52 10,30" fill="#ffffff"/><polygon points="10,50 50,72 90,50 90,60 50,82 10,60" fill="#ffffff" opacity=".75"/><polygon points="10,68 50,90 90,68 90,76 50,96 10,76" fill="#ffffff" opacity=".5"/></g><polyline points="34.9,25.0 54.0,14.0 73.1,25.0" fill="none" stroke="#a7edf8" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round"/></g><text x="96" y="34" font-size="19" font-weight="800" fill="#fff" letter-spacing="2.6">THE LIVING CITY</text><rect x="96" y="44" width="192" height="2" rx="1" fill="#22d3ee" opacity=".55"/><text x="28" y="84" font-size="14.5" fill="#cbd5e1">One full year of work rendered as an isometric hologram and rebuilt daily by a GitHub Actions</text><text x="28" y="111" font-size="14.5" fill="#cbd5e1">satellite. Each floor tile is a day, each tower is code shipped that day. The pentagon radar scores</text><text x="28" y="138" font-size="14.5" fill="#cbd5e1">Commit, Issue, Pull Request, Review and Repo - pure proof of work, with no language labels by</text><text x="28" y="165" font-size="14.5" fill="#cbd5e1">design.</text>
</svg>
