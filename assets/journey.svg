<svg xmlns="http://www.w3.org/2000/svg" width="888" height="510" viewBox="0 0 888 510" role="img" aria-labelledby="t d">
<title id="t">Odyssey: experience timeline 2021 to 2026 plus Mechatronics Engineering education</title>
<desc id="d">Getting Started 2021-2022, Leveling Up 2023, Going Pro 2024, Specialization 2025-2026, Mechatronics Engineering at Delta University.</desc>
<defs><filter id="b4" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter><filter id="b10" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter><filter id="b18" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter><linearGradient id="jof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2142"/><stop offset="1" stop-color="#0f1530"/></linearGradient><linearGradient id="job" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.95"/><stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.08"/></linearGradient><radialGradient id="jog" cx=".1" cy=".05" r=".8"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<style>
text{font-family:'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
.m{font-family:'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
@keyframes sweep{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
.fl{animation:fl 5.5s ease-in-out infinite}
.fl2{animation:fl 7s ease-in-out -2s infinite}
.fl3{animation:fl 4.6s ease-in-out -1s infinite}
.tw{animation:tw 3.4s ease-in-out infinite}
.pr{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
.sw{animation:sweep 5s linear infinite}
.sw2{animation:sweep 4s linear infinite}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 2.2s .4s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
