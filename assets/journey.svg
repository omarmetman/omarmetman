3" fill="#492237"/><circle cx="190" cy="250.0" r="7" fill="#f472b6"/><line x1="60" y1="248.0" x2="170" y2="248.0" stroke="#f472b6" stroke-opacity=".4" stroke-width="1.5"/><rect x="28.0" y="224.0" width="45.3" height="24" rx="12.0" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".55"/><text class="m" x="50.6" y="240.0" font-size="11" text-anchor="middle" fill="#fab8da" letter-spacing=".3">2024</text><text x="218" y="242.0" font-size="18" font-weight="800" fill="#fff">Going Pro</text><text x="218" y="266.0" font-size="13.5" fill="#94a3b8">13+ client projects, Next.js, Firebase and AI integration.</text><circle cx="190" cy="342.0" r="13" fill="#0a3b1c"/><circle cx="190" cy="342.0" r="7" fill="#22c55e"/><line x1="60" y1="340.0" x2="170" y2="340.0" stroke="#22c55e" stroke-opacity=".4" stroke-width="1.5"/><rect x="28.0" y="316.0" width="79.4" height="24" rx="12.0" fill="#22c55e" fill-opacity=".14" stroke="#22c55e" stroke-opacity=".55"/><text class="m" x="67.7" y="332.0" font-size="11" text-anchor="middle" fill="#90e2ae" letter-spacing=".3">2025-2026</text><text x="218" y="334.0" font-size="18" font-weight="800" fill="#fff">Specialization</text><text x="218" y="358.0" font-size="13.5" fill="#94a3b8">Full-stack AI, a 24-page site, 64+ articles and full</text><text x="218" y="378.0" font-size="13.5" fill="#94a3b8">automation.</text><circle cx="190" cy="434.0" r="13" fill="#4a2f03"/><circle cx="190" cy="434.0" r="7" fill="#f59e0b"/><line x1="60" y1="432.0" x2="170" y2="432.0" stroke="#f59e0b" stroke-opacity=".4" stroke-width="1.5"/><rect x="28.0" y="408.0" width="38.5" height="24" rx="12.0" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-opacity=".55"/><text class="m" x="47.2" y="424.0" font-size="11" text-anchor="middle" fill="#face85" letter-spacing=".3">EDU</text><text x="218" y="426.0" font-size="18" font-weight="800" fill="#fff">Mechatronics Engineering</text><text x="218" y="450.0" font-size="13.5" fill="#94a3b8">Delta University, Sophomore. First-year Smart Garage: Arduino,</text><text x="218" y="470.0" font-size="13.5" fill="#94a3b8">fingerprint, WebSocket remote.</text>
