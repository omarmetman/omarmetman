<svg xmlns="http://www.w3.org/2000/svg" width="888" height="568" viewBox="0 0 888 568" role="img" aria-labelledby="t d">
<title id="t">Field manual: how to read the living city, the language donut and the serpent</title>
<desc id="d">How to read this battlefield. Vanity metrics rot; a daily-rebuilt city does not lie.</desc>
<defs><filter id="b4" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter><filter id="b10" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter><filter id="b18" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter><linearGradient id="lgdf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2142"/><stop offset="1" stop-color="#0f1530"/></linearGradient><linearGradient id="lgdb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.95"/><stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0.08"/></linearGradient><radialGradient id="lgdg" cx=".1" cy=".05" r=".8"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient></defs>
<style>
text{font-family:'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
.m{font-family:'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
@keyframes sweep{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
.fl{animation:fl 5.5s ease-in-out infinite}
.fl2{animation:fl 7s ease-in-out -2s infinite}
.fl3{animation:fl 4.6s ease-in-out -1s infinite}
.tw{animation:tw 3.4s ease-in-out infinite}
.pr{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
.sw{animation:sweep 5s linear infinite}
.sw2{animation:sweep 4s linear infinite}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 2.2s .4s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="14" y="24" width="860" height="542" rx="22" fill="#000" opacity=".5" filter="url(#b10)"/><rect x="4" y="16" width="880" height="546" rx="22" fill="#241840"/><rect x="4" y="10.0" width="880" height="546" rx="22" fill="#3a2767"/><rect x="4" y="4" width="880" height="546" rx="22" fill="url(#lgdf)"/><rect x="4" y="4" width="880" height="546" rx="22" fill="url(#lgdg)"/><rect x="4.75" y="4.75" width="878.5" height="544.5" rx="21.5" fill="none" stroke="url(#lgdb)" stroke-width="1.5"/><line x1="26" y1="5.5" x2="862" y2="5.5" stroke="#fff" stroke-opacity=".14"/><text class="m" x="32" y="36" font-size="12" letter-spacing="3" fill="#c4b5fd" font-weight="700">FIELD MANUAL</text><text x="30" y="64" font-size="21" font-weight="800" fill="#fff">How to read this battlefield</text><rect x="30" y="74" width="828" height="120" rx="14" fill="#0b1020" fill-opacity=".65" stroke="#22d3ee" stroke-opacity=".35"/><ellipse cx="84" cy="140" rx="22" ry="6.2" fill="#000" opacity="0.45" filter="url(#b4)"/><g class="fl"><polygon points="63.2,98.0 84.0,110.0 84.0,134.0 63.2,122.0" fill="#1ba5ba"/><polygon points="84.0,110.0 104.8,98.0 104.8,122.0 84.0,134.0" fill="#116a77"/><polygon points="84.0,86.0 104.8,98.0 84.0,110.0 63.2,98.0" fill="#60dff3"/><g transform="matrix(0.2078 0.1200 -0.2078 0.1200 84.00 86.00)"><polygon points="50,8 90,30 50,52 10,30" fill="#ffffff"/><polygon points="10,50 50,72 90,50 90,60 50,82 10,60" fill="#ffffff" opacity=".75"/><polygon points="10,68 50,90 90,68 90,76 50,96 10,76" fill="#ffffff" opacity=".5"/></g><polyline points="63.2,98.0 84.0,86.0 104.8,98.0" fill="none" stroke="#a7edf8" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round"/></g><text x="128" y="110" font-size="16" font-weight="800" fill="#90e9f6" letter-spacing="1">THE LIVING CITY</text><text x="128" y="134" font-size="13" fill="#cbd5e1">The isometric hologram is a full year of GitHub, rebuilt daily: every</text><text x="128" y="154" font-size="13" fill="#cbd5e1">floor tile is one day, every tower is code shipped that day. The pentagon</text><text x="128" y="174" font-size="13" fill="#cbd5e1">radar scores 5 dimensions — Commit, Issue, Pull Request, Review, Repo —</text><text x="128" y="194" font-size="13" fill="#cbd5e1">and the donut weighs the languages that forged it all.</text><rect x="30" y="206" width="828" height="120" rx="14" fill="#0b1020" fill-opacity=".65" stroke="#f472b6" stroke-opacity=".35"/><ellipse cx="84" cy="272" rx="22" ry="6.2" fill="#000" opacity="0.45" filter="url(#b4)"/><g class="fl"><polygon points="63.2,230.0 84.0,242.0 84.0,266.0 63.2,254.0" fill="#be598e"/><polygon points="84.0,242.0 104.8,230.0 104.8,254.0 84.0,266.0" fill="#7a395b"/><polygon points="84.0,218.0 104.8,230.0 84.0,242.0 63.2,230.0" fill="#f799ca"/><g transform="matrix(0.2078 0.1200 -0.2078 0.1200 84.00 218.00)"><circle cx="50" cy="50" r="42" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polygon points="50,20 60,50 50,80 40,50" fill="#ffffff"/><polygon points="50,20 60,50 40,50" fill="#f472b6"/><circle cx="50" cy="50" r="5" fill="#6e3352"/></g><polyline points="63.2,230.0 84.0,218.0 104.8,230.0" fill="none" stroke="#fbc7e2" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round"/></g><text x="128" y="242" font-size="16" font-weight="800" fill="#fab8da" letter-spacing="1">THE LANGUAGE DONUT</text><text x="128" y="266" font-size="13" fill="#cbd5e1">JavaScript, HTML, Python, TypeScript — this is not decoration. It is the</text><text x="128" y="286" font-size="13" fill="#cbd5e1">exact share of code written across every public repository, recomputed on</text><text x="128" y="306" font-size="13" fill="#cbd5e1">every single render.</text><rect x="30" y="338" width="828" height="120" rx="14" fill="#0b1020" fill-opacity=".65" stroke="#22c55e" stroke-opacity=".35"/><ellipse cx="84" cy="404" rx="22" ry="6.2" fill="#000" opacity="0.45" filter="url(#b4)"/><g class="fl"><polygon points="63.2,362.0 84.0,374.0 84.0,398.0 63.2,386.0" fill="#1b9a49"/><polygon points="84.0,374.0 104.8,362.0 104.8,386.0 84.0,398.0" fill="#11622f"/><polygon points="84.0,350.0 104.8,362.0 84.0,374.0 63.2,362.0" fill="#60d58b"/><g transform="matrix(0.2078 0.1200 -0.2078 0.1200 84.00 350.00)"><path d="M12 82 C30 82 30 60 48 60 C66 60 60 34 78 34 L88 34" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="12" cy="82" r="9" fill="#ffffff"/><circle cx="88" cy="34" r="9" fill="#ffffff"/><circle cx="48" cy="60" r="6" fill="#ffffff"/></g><polyline points="63.2,362.0 84.0,350.0 104.8,362.0" fill="none" stroke="#a7e8bf" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round"/></g><text x="128" y="374" font-size="16" font-weight="800" fill="#90e2ae" letter-spacing="1">THE SERPENT</text><text x="128" y="398" font-size="13" fill="#cbd5e1">A snake that eats the contribution grid, cell by cell. It only moves where</text><text x="128" y="418" font-size="13" fill="#cbd5e1">there is history to devour — so a long snake is proof of consistency, the</text><text x="128" y="438" font-size="13" fill="#cbd5e1">one statistic that cannot be faked.</text><rect x="30" y="478" width="828" height="44" rx="22" fill="#052e1b" fill-opacity=".8" stroke="#22c55e" stroke-opacity=".5"/><text x="44" y="506" font-size="14" font-weight="700" fill="#86efac">Vanity metrics rot — but a daily-rebuilt city cannot lie.</text>
</svg>
